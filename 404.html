<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Em construção · Filipa Osório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;1,300;1,400&family=Lora:wght@400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #faf6ef; color: #1a1410; font-family: 'Lora', serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem; }
main { max-width: 480px; }
.eyebrow { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; color: #c9a86c; margin-bottom: 1rem; }
h1 { font-family: 'Spectral', serif; font-size: 34px; font-weight: 300; font-style: italic; line-height: 1.25; margin-bottom: 1rem; }
.sub { font-family: 'Spectral', serif; font-size: 17px; font-weight: 300; font-style: italic; color: #7a2535; line-height: 1.7; margin-bottom: 2rem; }
.btn { display: inline-block; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 300; letter-spacing: 0.15em; text-transform: uppercase; color: #f7f3ee; background: #7a2535; border-radius: 40px; padding: 14px 40px; text-decoration: none; }
.btn:hover { background: #5c1c28; }
.back { margin-top: 1.5rem; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 300; }
.back a { color: #9a7e52; }
.line { width: 60px; height: 0.5px; background: #c9a86c; margin: 0 auto 1.5rem; }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Em construção</p>
  <div class="line"></div>
  <h1>Estou a reorganizar este espaço</h1>
  <p class="sub">O outono pede reestruturação 🍂 Entretanto, a CEEN, Clareza, Estratégia e Energia no Negócio, já está disponível.</p>
  <a class="btn" href="/ceen/">Conhecer a CEEN</a>
  <p class="back"><a href="/">Voltar ao início</a></p>
</main>
</body>
</html>
