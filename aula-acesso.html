<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O teu acesso — Filipa Osório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f0e4;
    --bg-deep: #efe4d2;
    --ink: #3a2e28;
    --ink-soft: #6b5d51;
    --gold: #a9834f;
    --gold-deep: #8a6a3d;
    --line: rgba(138, 106, 61, 0.28);
    --display: 'Cormorant Garamond', serif;
    --body: 'EB Garamond', serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: radial-gradient(ellipse at top, var(--bg-deep) 0%, var(--bg) 55%);
    color: var(--ink);
    font-family: var(--body);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }

  .page {
    width: 100%;
    max-width: 640px;
    text-align: center;
  }

  .sigil {
    width: 34px;
    height: 34px;
    margin: 0 auto 28px;
    opacity: 0.75;
  }

  .eyebrow {
    font-family: var(--body);
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold-deep);
    margin: 0 0 14px;
  }

  h1 {
    font-family: var(--display);
    font-weight: 500;
    font-size: clamp(28px, 5vw, 40px);
    line-height: 1.25;
    margin: 0 0 36px;
    color: var(--ink);
  }

  .frame {
    position: relative;
    border: 1px solid var(--line);
    padding: 10px;
    background: #fffdf8;
    box-shadow: 0 18px 40px -20px rgba(58, 46, 40, 0.35);
    margin-bottom: 36px;
  }

  .video-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    overflow: hidden;
    background: #000;
  }

  .video-wrap iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: 0;
  }

  .corner {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 1px solid var(--gold);
    opacity: 0.6;
  }
  .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }

  .divider {
    width: 44px;
    height: 1px;
    background: var(--line);
    margin: 0 auto 28px;
  }

  .closing {
    font-family: var(--display);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(18px, 3vw, 21px);
    line-height: 1.6;
    color: var(--ink-soft);
    max-width: 460px;
    margin: 0 auto;
  }

  .signature {
    margin-top: 40px;
    font-family: var(--display);
    font-size: 16px;
    color: var(--gold-deep);
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: no-preference) {
    .page { animation: rise 0.9s ease-out both; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

  <main class="page">
    <svg class="sigil" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="17" cy="17" r="9" stroke="#a9834f" stroke-width="1"/>
      <circle cx="17" cy="17" r="1.6" fill="#a9834f"/>
      <line x1="17" y1="1" x2="17" y2="6" stroke="#a9834f" stroke-width="1"/>
      <line x1="17" y1="28" x2="17" y2="33" stroke="#a9834f" stroke-width="1"/>
    </svg>

    <p class="eyebrow">Acesso pessoal</p>
    <h1>A tua aula está aqui,<br>quando estiveres pronta.</h1>

    <div class="frame">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="video-wrap">
        <iframe
          src="https://www.youtube-nocookie.com/embed/PAeRLHt8BfQ?modestbranding=1&rel=0&showinfo=0&color=white"
          title="Aula — Filipa Osório"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <div class="divider"></div>
    <p class="closing">Antes de qualquer transformação ser partilhada com o mundo lá fora, ela precisa de um espaço só seu. É o que este acesso é.</p>

    <p class="signature">— Filipa</p>
  </main>

</body>
</html>
