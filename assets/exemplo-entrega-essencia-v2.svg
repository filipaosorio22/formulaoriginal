<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" rx="18" fill="#faf6ef"/><rect x="28" y="28" width="1144" height="584" rx="12" fill="none" stroke="#c9a86c" stroke-opacity=".5"/><text x="74" y="76" font-size="14" fill="#9a7e52" font-family="sans-serif" letter-spacing="2">FILIPA OSÓRIO  /  LEITURA DA ESSÊNCIA</text><text x="74" y="145" font-size="43" fill="#7a2535" font-family="Georgia">O teu momento. Os teus mapas.</text><text x="74" y="198" font-size="43" fill="#7a2535" font-family="Georgia" font-style="italic">Uma nova perspetiva.</text><text x="74" y="246" font-size="19" fill="#64554a" font-family="Georgia">Um espaço para ligares pontos e levares a Leitura para a tua vida, ao teu ritmo.</text><path d="M74 276H1126" stroke="#c9a86c" stroke-opacity=".6"/><rect x="74" y="310" width="338" height="158" rx="10" fill="#fffdf9" stroke="#d9c8aa"/><text x="96" y="341" font-size="11" fill="#9a7e52" font-family="sans-serif" letter-spacing="2">ESCUTAR</text><text x="96" y="379" font-size="26" fill="#7a2535" font-family="Georgia">A tua Leitura</text><text x="96" y="411" font-size="15" fill="#64554a" font-family="Georgia">O teu ponto de partida e o fio</text><text x="96" y="433" font-size="15" fill="#64554a" font-family="Georgia">condutor.</text><rect x="430" y="310" width="338" height="158" rx="10" fill="#fffdf9" stroke="#d9c8aa"/><text x="452" y="341" font-size="11" fill="#9a7e52" font-family="sans-serif" letter-spacing="2">EXPERIMENTAR</text><text x="452" y="379" font-size="26" fill="#7a2535" font-family="Georgia">Da Leitura à vida</text><text x="452" y="411" font-size="15" fill="#64554a" font-family="Georgia">Perguntas e pequenas experiências</text><text x="452" y="433" font-size="15" fill="#64554a" font-family="Georgia">no quotidiano.</text><rect x="786" y="310" width="338" height="158" rx="10" fill="#fffdf9" stroke="#d9c8aa"/><text x="808" y="341" font-size="11" fill="#9a7e52" font-family="sans-serif" letter-spacing="2">INTEGRAR</text><text x="808" y="379" font-size="26" fill="#7a2535" font-family="Georgia">O teu espaço</text><text x="808" y="411" font-size="15" fill="#64554a" font-family="Georgia">Um lugar para as tuas notas e</text><text x="808" y="433" font-size="15" fill="#64554a" font-family="Georgia">descobertas.</text><text x="74" y="540" font-size="20" fill="#7a2535" font-family="Georgia">Não para te prender a uma definição. Para abrir espaço a outras possibilidades.</text><text x="74" y="580" font-size="12" fill="#8a7a64" font-family="sans-serif">Demonstração fictícia · Conteúdo escrito personalizado · Sem dados de clientes</text></svg>