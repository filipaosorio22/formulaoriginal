<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990"><rect width="1200" height="990" rx="18" fill="#201b18"/><rect x="28" y="28" width="1144" height="934" rx="12" fill="none" stroke="#c9a86c" stroke-opacity=".5"/><text x="74" y="76" font-size="14" fill="#d7b77f" font-family="sans-serif" letter-spacing="2">FILIPA OSÓRIO  /  LEITURA DE ESSÊNCIA</text><text x="74" y="145" font-size="43" fill="#edb6c1" font-family="Georgia" >O teu momento. Os teus mapas.</text><text x="74" y="198" font-size="43" fill="#edb6c1" font-family="Georgia" font-style="italic">Uma nova perspetiva.</text><text x="74" y="246" font-size="19" fill="#eee3d5" font-family="Georgia" >Um espaço para ligares pontos e levares a Leitura para a tua vida, ao teu ritmo.</text><path d="M74 276H1126" stroke="#c9a86c" stroke-opacity=".6"/><rect x="74" y="310" width="338" height="158" rx="10" fill="#2c2420" stroke="#806b4a"/><text x="96" y="341" font-size="11" fill="#d7b77f" font-family="sans-serif" letter-spacing="2">ESCUTAR</text><text x="96" y="379" font-size="26" fill="#edb6c1" font-family="Georgia" >A tua Leitura</text><text x="96" y="411" font-size="15" fill="#eee3d5" font-family="Georgia" >O teu ponto de partida e o fio</text><text x="96" y="433" font-size="15" fill="#eee3d5" font-family="Georgia" >condutor.</text><rect x="430" y="310" width="338" height="158" rx="10" fill="#2c2420" stroke="#806b4a"/><text x="452" y="341" font-size="11" fill="#d7b77f" font-family="sans-serif" letter-spacing="2">CONHECER</text><text x="452" y="379" font-size="26" fill="#edb6c1" font-family="Georgia" >Os teus mapas</text><text x="452" y="411" font-size="15" fill="#eee3d5" font-family="Georgia" >Astrologia e Human Design numa</text><text x="452" y="433" font-size="15" fill="#eee3d5" font-family="Georgia" >leitura integrada.</text><rect x="786" y="310" width="338" height="158" rx="10" fill="#2c2420" stroke="#806b4a"/><text x="808" y="341" font-size="11" fill="#d7b77f" font-family="sans-serif" letter-spacing="2">IMAGINAR</text><text x="808" y="379" font-size="26" fill="#edb6c1" font-family="Georgia" >A tua história</text><text x="808" y="411" font-size="15" fill="#eee3d5" font-family="Georgia" >Uma narrativa simbólica para olhar</text><text x="808" y="433" font-size="15" fill="#eee3d5" font-family="Georgia" >de novo.</text><rect x="74" y="490" width="338" height="158" rx="10" fill="#2c2420" stroke="#806b4a"/><text x="96" y="521" font-size="11" fill="#d7b77f" font-family="sans-serif" letter-spacing="2">RECONHECER</text><text x="96" y="559" font-size="26" fill="#edb6c1" font-family="Georgia" >Ligar os pontos</text><text x="96" y="591" font-size="15" fill="#eee3d5" font-family="Georgia" >As relações, os temas e as</text><text x="96" y="613" font-size="15" fill="#eee3d5" font-family="Georgia" >perguntas que se abrem.</text><rect x="430" y="490" width="338" height="158" rx="10" fill="#2c2420" stroke="#806b4a"/><text x="452" y="521" font-size="11" fill="#d7b77f" font-family="sans-serif" letter-spacing="2">EXPERIMENTAR</text><text x="452" y="559" font-size="26" fill="#edb6c1" font-family="Georgia" >Da Leitura à vida</text><text x="452" y="591" font-size="15" fill="#eee3d5" font-family="Georgia" >Perguntas e pequenas experiências</text><text x="452" y="613" font-size="15" fill="#eee3d5" font-family="Georgia" >no quotidiano.</text><rect x="786" y="490" width="338" height="158" rx="10" fill="#2c2420" stroke="#806b4a"/><text x="808" y="521" font-size="11" fill="#d7b77f" font-family="sans-serif" letter-spacing="2">INTEGRAR</text><text x="808" y="559" font-size="26" fill="#edb6c1" font-family="Georgia" >O teu espaço</text><text x="808" y="591" font-size="15" fill="#eee3d5" font-family="Georgia" >Um lugar para as tuas notas e</text><text x="808" y="613" font-size="15" fill="#eee3d5" font-family="Georgia" >descobertas.</text><rect x="74" y="700" width="1050" height="154" rx="12" fill="#362b25"/><text x="100" y="736" font-size="11" fill="#d7b77f" font-family="sans-serif" letter-spacing="2">PERGUNTAS PARA LEVAR CONTIGO</text><path d="M103 771l8 5-8 5z" fill="#edb6c1"/><text x="126" y="783" font-family="Georgia" font-size="22" fill="#edb6c1">ler mais</text><text x="74" y="901" font-size="20" fill="#edb6c1" font-family="Georgia" >Não para te prender a uma definição. Para abrir espaço a outras possibilidades.</text><text x="74" y="934" font-size="12" fill="#ccbda8" font-family="sans-serif" >Demonstração fictícia · Conteúdo escrito personalizado · Sem dados de clientes</text></svg>